spring.application.name=marcenariapro
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:marcenariapro}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Armazenamento de comprovantes
app.upload.dir=./comprovantes

# Limites para envio de arquivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB